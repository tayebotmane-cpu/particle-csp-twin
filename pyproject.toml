[project]
name = "particle-csp-twin"
version = "0.1.0"
description = "Hybrid physics-AI modelling and digital twins for particle-based CSP and thermal energy storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "xarray>=2024.10",
    "zarr>=3.0",
    "h5py>=3.11",
    "h5netcdf>=1.4",
    "pyyaml>=6.0",
    "casadi>=3.6.7",
    "CoolProp>=6.6",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# Multi-GB install; not part of the default environment. Needed from the
# neural-operator / PINN / graph-network work onwards.
ml = ["torch>=2.4"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcsp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "slow: takes more than a few seconds; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "SIM"]
ignore = [
    "E741", # single-letter names such as l, I are standard in the physics here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
